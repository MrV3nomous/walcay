name: Walcay Wall Render Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase rebuild job ID (informational; worker claims the current revision)
        required: false
        type: string
      target_revision:
        description: Requested Wall revision (informational; worker claims the current revision)
        required: false
        type: string

permissions:
  contents: read

# GitHub allows one active run and one pending run in this concurrency group.
# New pending dispatches replace older pending runs; the active worker's lease
# and revision checks protect publication. The worker always claims the latest
# required revision, so the queued run processes the newest state.
concurrency:
  group: walcay-wall-render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Process latest Wall rebuild job
        env:
          WALCAY_SUPABASE_URL: ${{ secrets.WALCAY_SUPABASE_URL }}
          WALCAY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WALCAY_SUPABASE_SERVICE_ROLE_KEY }}
          WALL_WORKER_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          WALL_WORKER_MODE: process
          DISPATCHED_JOB_ID: ${{ inputs.job_id }}
          DISPATCHED_TARGET_REVISION: ${{ inputs.target_revision }}
        run: npx tsx scripts/wall-worker.ts
